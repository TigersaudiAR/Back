# Netlify Configuration for Quran Al-Huda

[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# Environment variables for Netlify Functions
# Set these in Netlify dashboard: Site settings > Environment variables
# 
# Required:
# QURAN_BASE - Base URL for King Fahd Complex API (default: https://qurancomplex.gov.sa/quran-dev)
# 
# Optional:
# QURAN_API_KEY - API key for King Fahd Complex API (if required)
#
# Note: VITE_* variables are for client-side build, use QURAN_* for Functions

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
